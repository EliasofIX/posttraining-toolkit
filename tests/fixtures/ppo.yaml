run_name: test-ppo
base_model: distilgpt2
method: ppo

data:
  source: dataset
  dataset:
    path: data/train.jsonl
    format: jsonl
    text_column: text

training:
  epochs: 1
  max_iters: 2
  learning_rate: 1.0e-5
  batch_size: 1
  max_seq_length: 64
  logging_steps: 1
  save_steps: 2
  rl:
    beta: 0.1
    reward_model: distilgpt2
    kl_coef: 0.05
    max_completion_length: 16

compute:
  device: cpu
  strategy: single_gpu
  mixed_precision: fp32

output:
  dir: ./test_outputs
  export:
    - adapter_only
