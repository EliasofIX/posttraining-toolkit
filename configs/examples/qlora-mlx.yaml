# Apple Silicon QLoRA via MLX (true 4-bit).
# Install: pip install -e ".[mlx]"
# Swap base_model and data paths for your run.

run_name: qlora-mlx-example
base_model: Qwen/Qwen3-0.6B
method: qlora

data:
  source: dataset
  dataset:
    path: ../../data/train.jsonl
    format: jsonl
    text_column: text

training:
  epochs: 1
  max_iters: 20
  learning_rate: 2.0e-4
  batch_size: 1
  max_seq_length: 256
  logging_steps: 5
  save_steps: 20
  gradient_checkpointing: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
  quantization:
    bits: 4
    backend: auto
    group_size: 64

compute:
  strategy: auto
  device: auto

output:
  dir: ./outputs
  export:
    - adapter_only
