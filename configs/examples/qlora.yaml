run_name: qlora-distilgpt2
base_model: distilgpt2
method: qlora

data:
  source: dataset
  dataset:
    path: ../../data/train.jsonl
    format: jsonl
    text_column: text

training:
  epochs: 1
  max_iters: 5
  learning_rate: 2.0e-4
  batch_size: 1
  max_seq_length: 128
  logging_steps: 2
  save_steps: 5
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
  quantization:
    bits: 4
    quant_type: nf4
    backend: auto
    double_quant: true

compute:
  strategy: auto
  device: auto

output:
  dir: ./outputs
  export:
    - adapter_only
