[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posttraining-toolkit"
version = "0.1.0"
description = "Declarative posttraining pipeline for SFT, LoRA, QLoRA, DPO, PPO, and GRPO"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Posttraining Toolkit Contributors" }]
keywords = ["llm", "fine-tuning", "lora", "qlora", "dpo", "ppo", "grpo", "trl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.4.0",
    "datasets>=4.7.0",
    "peft>=0.10.0",
    "pydantic>=2.6.0",
    "torch>=2.1.0",
    "transformers>=4.56.2",
    "trl>=1.7.0,<2",
]

[project.optional-dependencies]
cuda = [
    "bitsandbytes>=0.43.0",
    "deepspeed>=0.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]
gguf = [
    "gguf>=0.10.0",
]
parquet = [
    "pyarrow>=14.0.0",
]
all = [
    "posttraining-toolkit[cuda,dev,gguf,parquet]",
]

[project.scripts]
ptk = "ptk.cli:main"

[project.urls]
Homepage = "https://github.com/posttraining-toolkit/posttraining-toolkit"
Documentation = "https://github.com/posttraining-toolkit/posttraining-toolkit#readme"
Repository = "https://github.com/posttraining-toolkit/posttraining-toolkit"

[tool.hatch.build.targets.wheel]
packages = ["ptk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
