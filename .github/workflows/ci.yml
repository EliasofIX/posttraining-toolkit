name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check ptk tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev,gguf]"

      - name: Unit tests
        run: pytest tests/ -v -m "not slow" --tb=short

  integration:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev,gguf]"

      - name: Integration tests (all methods + GGUF export)
        run: pytest tests/test_integration.py tests/test_gguf_export.py -v -m slow --tb=short
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        # QLoRA e2e on CPU covers the non-quantized fallback path only.
        # Real bitsandbytes QLoRA requires a CUDA runner with extras [cuda].

  # Apple Silicon MPS parity — runs on macOS arm64 when available
  mps-smoke:
    runs-on: macos-14
    continue-on-error: true  # MPS runner availability varies; non-blocking signal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Hardware detection smoke
        run: |
          python -c "
          import torch
          from ptk.distributed.detect import detect_environment
          from ptk.config.schema import DeviceType, ComputeStrategy
          env = detect_environment(device=DeviceType.AUTO, strategy=ComputeStrategy.AUTO)
          print('device:', env.device.value, 'mps:', torch.backends.mps.is_available())
          "

      - name: Config validation
        run: ptk validate tests/fixtures/sft.yaml --json
